name: Standalone Windows SDK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/standalone-windows.yml'
      - 'Tools/Test-StandaloneHost.ps1'
permissions:
  contents: read
jobs:
  standalone-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Obtain exact public source components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $components = Join-Path $env:RUNNER_TEMP 'R4OS/Temp/Sources'
          New-Item -ItemType Directory -Path $components -Force | Out-Null
          $pins = @(
            @('r4os-sdk', $env:GITHUB_SHA, 'SDK'),
            @('r4os-contract', '922eb1a100df212e078e7ccdbea5525b77fe85da', 'Contract'),
            @('r4os-libraries', 'afdccd30f0ef94d7e8173a592142ddb87960033c', 'Libraries'),
            @('r4os-devkit', 'fbda0fd9824bb6dd59348f786b96af874b1e4c52', 'DevKit')
          )
          foreach ($item in $pins) {
            $destination = Join-Path $components $item[2]
            git -c core.autocrlf=false -c core.longpaths=true clone --quiet --no-checkout --single-branch ('https://github.com/R4OSDev/' + $item[0] + '.git') $destination
            if ($LASTEXITCODE) { throw ('Cannot obtain ' + $item[2]) }
            git -C $destination -c core.autocrlf=false -c core.longpaths=true checkout --quiet --detach $item[1]
            if ($LASTEXITCODE) { throw ('Cannot select exact ' + $item[2]) }
            $actual = (git -C $destination rev-parse HEAD) -join ''
            if ($LASTEXITCODE -or $actual -cne $item[1]) { throw 'Source revision differs' }
          }
          "R4OS_CI_COMPONENTS=$components" >> $env:GITHUB_ENV
      - name: Real standalone Windows builds and native C/Rust execution
        shell: pwsh
        run: |
          $components = $env:R4OS_CI_COMPONENTS
          & (Join-Path $components 'SDK/Tools/Test-StandaloneHost.ps1') `
            -ContractRoot (Join-Path $components 'Contract') `
            -LibraryRoot (Join-Path $components 'Libraries') `
            -DevKitRoot (Join-Path $components 'DevKit') `
            -WorkRoot (Join-Path $env:RUNNER_TEMP 'R4OS/Temp/Standalone') `
            -ArtifactRoot (Join-Path $env:RUNNER_TEMP 'R4OS/Temp/Result')
      - name: Retain only compact result and guest consumers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: standalone-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/R4OS/Temp/Result/
          if-no-files-found: error
          retention-days: 1
